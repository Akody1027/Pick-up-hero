<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pick Up Hero - Admin Command</title>

    <link rel="icon" href="hero.ico" type="image/x-icon" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="theme-color" content="#ee611c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Hero Admin" />

    <style>
      :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --surface-elevated: #2c2c2c;
        --accent: #ee611c;
        --accent-hover: #d95314;
        --text: #ffffff;
        --text-muted: #94a3b8;
        --border: #333333;
        --success: #22c55e;
        --danger: #ef4444;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      body,
      html {
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
      }

      /* --- HEADER --- */
      header {
        background: var(--surface);
        padding: 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }

      header h1 {
        font-size: 1.4rem;
        color: var(--accent);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* --- TAB NAVIGATION --- */
      .tabs {
        display: flex;
        background: var(--surface-elevated);
        border-bottom: 1px solid var(--border);
      }

      .tab-btn {
        flex: 1;
        padding: 15px 0;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        border-bottom: 3px solid transparent;
      }

      .tab-btn.active {
        color: var(--accent);
        border-bottom: 3px solid var(--accent);
        background: rgba(238, 97, 28, 0.05);
      }

      /* --- MAIN CONTENT & GRIDS --- */
      .content-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: none;
      }

      .content-area.active {
        display: block;
      }

      .data-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }

      .data-card {
        background: var(--surface-elevated);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: transform 0.2s ease;
      }

      .data-card:hover {
        transform: translateY(-2px);
        border-color: rgba(238, 97, 28, 0.3);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 15px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
      }

      .card-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--surface);
        border: 2px solid var(--border);
      }

      .card-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
      }

      .card-subtitle {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: monospace;
        margin-top: 4px;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
      }

      .info-label {
        color: var(--text-muted);
      }

      .info-value {
        color: var(--text);
        font-weight: 600;
      }

      /* --- FORMS & BUTTONS --- */
      .btn {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: var(--accent);
        color: white;
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-emergency {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        border: 1px solid rgba(239, 68, 68, 0.4);
      }

      .form-group {
        margin-bottom: 20px;
        width: 100%;
      }
      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .form-group input {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface-elevated);
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }
      .form-group input:focus {
        border-color: var(--accent);
      }

      /* --- AUTHENTICATION OVERLAY --- */
      #authOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(18, 18, 18, 0.98);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      .auth-card {
        background: var(--surface);
        width: 90%;
        max-width: 400px;
        padding: 35px 25px;
        border-radius: 24px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .auth-card h2 {
        color: var(--accent);
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: 8px;
      }

      .auth-card p {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 30px;
      }

      /* --- DOUBLE VERIFICATION MODAL --- */
      .soft-prompt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        z-index: 4000;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }

      .soft-prompt-box {
        background: var(--surface);
        padding: 24px;
        border-radius: 16px;
        width: 85%;
        max-width: 380px;
        border: 1px solid var(--danger);
        box-shadow: 0 10px 40px rgba(239, 68, 68, 0.2);
        text-align: center;
      }

      .soft-prompt-box h3 {
        margin-bottom: 12px;
        color: var(--danger);
        font-size: 1.4rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .soft-prompt-box p {
        color: var(--text);
        font-size: 0.95rem;
        margin-bottom: 25px;
        line-height: 1.5;
      }

      .prompt-actions {
        display: flex;
        gap: 12px;
      }

    </style>
  </head>
  <body>

    <!-- AUTHENTICATION OVERLAY -->
    <div id="authOverlay">
      <div class="auth-card">
        <h2>Admin Gateway</h2>
        <p>Master Directory Access.</p>

        <div class="form-group">
          <label>Admin Email</label>
          <input type="email" id="authEmail" placeholder="admin@example.com" />
        </div>

        <div class="form-group" style="margin-bottom: 30px;">
          <label>Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" id="authSubmitBtn" onclick="handleAuthAction()">
          Authenticate
        </button>
      </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <header>
      <h1>Pickup Hero Admin</h1>
      <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" onclick="signOutAdmin()">Sign Out</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tabDriversBtn" onclick="switchTab('drivers')">Drivers Directory</button>
      <button class="tab-btn" id="tabCustomersBtn" onclick="switchTab('customers')">Customers Directory</button>
    </div>

    <!-- DRIVERS VIEW -->
    <div class="content-area active" id="viewDrivers">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 1.2rem; color: var(--text-muted);">Registered Heroes</h2>
        <span id="driverCountDisplay" style="background: var(--surface-elevated); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); font-weight: bold;">0</span>
      </div>
      <div class="data-grid" id="driversGrid">
        <p style="color: var(--text-muted);">Loading drivers...</p>
      </div>
    </div>

    <!-- CUSTOMERS VIEW -->
    <div class="content-area" id="viewCustomers">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 1.2rem; color: var(--text-muted);">Registered Customers</h2>
        <span id="customerCountDisplay" style="background: var(--surface-elevated); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); font-weight: bold;">0</span>
      </div>
      <div class="data-grid" id="customersGrid">
        <p style="color: var(--text-muted);">Loading customers...</p>
      </div>
    </div>

    <!-- DESTRUCTIVE DOUBLE VERIFICATION MODAL -->
    <div class="soft-prompt-overlay" id="deleteVerifyModal">
      <div class="soft-prompt-box">
        <h3>Confirm Deletion</h3>
        <p id="deleteVerifyText">Are you absolutely sure you want to permanently delete this record? This action cannot be reversed.</p>
        <div class="prompt-actions">
          <button class="btn btn-secondary" style="flex: 1;" onclick="cancelDelete()">Cancel</button>
          <button class="btn btn-emergency" style="flex: 1; background: var(--danger); color: white;" id="confirmDeleteBtn" onclick="executeDelete()">Yes, Delete</button>
        </div>
      </div>
    </div>


    <!-- FIREBASE SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        setPersistence,
        browserSessionPersistence
      } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

      import {
        getFirestore,
        collection,
        onSnapshot,
        doc,
        deleteDoc
      } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDhSqKn5eg_X-c8uNMjp7BTDWgIpV8dnvI",
        authDomain: "pickuphero-1993f.firebaseapp.com",
        projectId: "pickuphero-1993f",
        storageBucket: "pickuphero-1993f.firebasestorage.app",
        messagingSenderId: "234138921429",
        appId: "1:234138921429:web:61071ce9b8e5e6ce70755c",
        measurementId: "G-88L5X10BTW",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // Expose to global window scope for architectural parity
      window.db = db;
      window.auth = auth;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.signOut = signOut;
      window.setPersistence = setPersistence;
      window.browserSessionPersistence = browserSessionPersistence;
      window.collection = collection;
      window.onSnapshot = onSnapshot;
      window.doc = doc;
      window.deleteDoc = deleteDoc;

      if (window.bootAdminApp) window.bootAdminApp();
    </script>

    <!-- ADMIN LOGIC -->
    <script>
      let activeDeleteTarget = null;
      let activeDeleteCollection = null;

      // --- AUTHENTICATION & BOOT ---
      window.bootAdminApp = function () {
        window.auth.onAuthStateChanged((user) => {
          if (user) {
            document.getElementById("authOverlay").style.display = "none";
            loadMasterDirectories();
          } else {
            document.getElementById("authOverlay").style.display = "flex";
          }
        });
      };

      window.handleAuthAction = async function () {
        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPassword").value.trim();
        const btn = document.getElementById("authSubmitBtn");

        if (!email || !password) {
          alert("Admin credentials required.");
          return;
        }

        btn.innerText = "Authenticating...";
        btn.disabled = true;

        try {
          await window.setPersistence(window.auth, window.browserSessionPersistence);
          await window.signInWithEmailAndPassword(window.auth, email, password);
          btn.innerText = "Authenticate";
          btn.disabled = false;
        } catch (error) {
          console.error("Admin Auth Error:", error);
          btn.innerText = "Authenticate";
          btn.disabled = false;
          alert("Access Denied: " + error.message.replace("Firebase:", "").trim());
        }
      };

      window.signOutAdmin = async function () {
        try {
          await window.signOut(window.auth);
          window.location.reload();
        } catch (error) {
          console.error("Sign Out Error:", error);
        }
      };

      // --- TAB SWITCHER ---
      window.switchTab = function (tabName) {
        document.getElementById("tabDriversBtn").classList.remove("active");
        document.getElementById("tabCustomersBtn").classList.remove("active");
        document.getElementById("viewDrivers").classList.remove("active");
        document.getElementById("viewCustomers").classList.remove("active");

        if (tabName === 'drivers') {
          document.getElementById("tabDriversBtn").classList.add("active");
          document.getElementById("viewDrivers").classList.add("active");
        } else {
          document.getElementById("tabCustomersBtn").classList.add("active");
          document.getElementById("viewCustomers").classList.add("active");
        }
      };

      // --- DATA LOADING & RENDERING ---
      window.loadMasterDirectories = function () {
        
        // 1. DRIVER LISTENER
        window.onSnapshot(window.collection(window.db, "driver_settings"), (snapshot) => {
          const grid = document.getElementById("driversGrid");
          document.getElementById("driverCountDisplay").innerText = snapshot.docs.length;
          let html = "";

          if (snapshot.empty) {
            html = `<p style="color: var(--text-muted);">No drivers registered in database.</p>`;
          } else {
            snapshot.forEach((docSnap) => {
              const d = docSnap.data();
              const uid = docSnap.id;
              
              const name = d.displayName || "Unknown Hero";
              const phone = d.phoneNumber || "No Phone Provided";
              const email = d.email || "Managed via Auth Console"; // Fallback if explicit email isn't in document
              const pic = d.profilePic || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";
              
              html += `
                <div class="data-card">
                  <div class="card-header">
                    <img src="${pic}" class="card-avatar" alt="Avatar">
                    <div>
                      <div class="card-title">${name}</div>
                      <div class="card-subtitle">UID: ${uid.substring(0,8)}...</div>
                    </div>
                  </div>
                  
                  <div class="info-row"><span class="info-label">Phone:</span> <span class="info-value">${phone}</span></div>
                  <div class="info-row"><span class="info-label">Email:</span> <span class="info-value" style="font-size:0.8rem;word-break:break-all;">${email}</span></div>
                  
                  <div style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 15px;">
                    <button class="btn btn-emergency" onclick="triggerDoubleVerification('driver', '${uid}', '${name.replace(/'/g, "\\'")}')">Delete Driver Profile</button>
                  </div>
                </div>
              `;
            });
          }
          grid.innerHTML = html;
        });

        // 2. CUSTOMER LISTENER
        window.onSnapshot(window.collection(window.db, "users"), (snapshot) => {
          const grid = document.getElementById("customersGrid");
          document.getElementById("customerCountDisplay").innerText = snapshot.docs.length;
          let html = "";

          if (snapshot.empty) {
            html = `<p style="color: var(--text-muted);">No customers registered in database.</p>`;
          } else {
            snapshot.forEach((docSnap) => {
              const c = docSnap.data();
              const uid = docSnap.id;
              
              const name = c.fullName || "Unknown Customer";
              const phone = c.phoneNumber || "No Phone Provided";
              const email = c.email || "Managed via Auth Console"; // Fallback

              html += `
                <div class="data-card">
                  <div class="card-header">
                    <div class="card-avatar" style="display:flex; align-items:center; justify-content:center; background:var(--accent); border:none; font-weight:bold; font-size:1.2rem;">${name.charAt(0).toUpperCase()}</div>
                    <div>
                      <div class="card-title">${name}</div>
                      <div class="card-subtitle">UID: ${uid.substring(0,8)}...</div>
                    </div>
                  </div>
                  
                  <div class="info-row"><span class="info-label">Phone:</span> <span class="info-value">${phone}</span></div>
                  <div class="info-row"><span class="info-label">Email:</span> <span class="info-value" style="font-size:0.8rem;word-break:break-all;">${email}</span></div>
                  
                  <div style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 15px;">
                    <button class="btn btn-emergency" onclick="triggerDoubleVerification('customer', '${uid}', '${name.replace(/'/g, "\\'")}')">Delete Customer Profile</button>
                  </div>
                </div>
              `;
            });
          }
          grid.innerHTML = html;
        });
      };

      // --- DESTRUCTIVE DOUBLE VERIFICATION ENGINE ---
      window.triggerDoubleVerification = function (type, uid, name) {
        activeDeleteTarget = uid;
        activeDeleteCollection = type === 'driver' ? 'driver_settings' : 'users';
        
        const modal = document.getElementById("deleteVerifyModal");
        const text = document.getElementById("deleteVerifyText");
        
        text.innerHTML = `Are you absolutely sure you want to permanently delete the profile for <strong style="color:var(--text);">${name}</strong>?<br><br><span style="font-size:0.8rem; color:var(--text-muted);">Note: This strips their Firestore data. Full Auth deletion must be finalized in the Firebase Console.</span>`;
        
        modal.style.display = "flex";
      };

      window.cancelDelete = function () {
        activeDeleteTarget = null;
        activeDeleteCollection = null;
        document.getElementById("deleteVerifyModal").style.display = "none";
      };

      window.executeDelete = async function () {
        if (!activeDeleteTarget || !activeDeleteCollection) return;
        
        const btn = document.getElementById("confirmDeleteBtn");
        const originalText = btn.innerText;
        btn.innerText = "Deleting...";
        btn.disabled = true;

        try {
          // Execute primary profile deletion
          await window.deleteDoc(window.doc(window.db, activeDeleteCollection, activeDeleteTarget));

          // If it's a driver, aggressively wipe their active routing state to keep the map clean
          if (activeDeleteCollection === 'driver_settings') {
            await window.deleteDoc(window.doc(window.db, "driver_locations", activeDeleteTarget));
            await window.deleteDoc(window.doc(window.db, "driver_state", activeDeleteTarget));
          }

          window.cancelDelete();
        } catch (error) {
          console.error("Deletion failed:", error);
          alert("Network Error: Failed to delete document.");
        } finally {
          btn.innerText = originalText;
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
